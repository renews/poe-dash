name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, lint, and test
        run: bun run check

      - name: Build release artifacts
        run: bun run build

      - name: Verify packaged native modules (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/check-packaged-native.cjs

      - name: Verify packaged native modules
        if: runner.os != 'Linux'
        run: node scripts/check-packaged-native.cjs
